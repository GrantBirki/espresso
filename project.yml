name: Espresso

options:
  bundleIdPrefix: io.birki
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: 6.0
    ENABLE_CODE_COVERAGE: NO
    CLANG_COVERAGE_MAPPING: NO

targets:
  Espresso:
    type: application
    platform: macOS
    sources:
      - Sources
    resources:
      - Sources/Resources/Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GIT_SHA: $(GIT_SHA)
        LSUIElement: true
        NSHighResolutionCapable: true
    settings:
      base:
        APP_DISPLAY_NAME: Espresso
        PRODUCT_BUNDLE_IDENTIFIER: io.birki.espresso
        SWIFT_VERSION: 6.0
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_CODE_COVERAGE: NO
        CLANG_COVERAGE_MAPPING: NO
        MARKETING_VERSION: 0.0.0
        CURRENT_PROJECT_VERSION: 0.0.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          APP_DISPLAY_NAME: Espresso Dev
          PRODUCT_BUNDLE_IDENTIFIER: io.birki.espresso.dev
        Release:
          ARCHS: arm64
          ONLY_ACTIVE_ARCH: "NO"
  EspressoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    settings:
      base:
        SWIFT_VERSION: 6.0
        ENABLE_CODE_COVERAGE: NO
        CLANG_COVERAGE_MAPPING: NO
    dependencies:
      - target: Espresso
